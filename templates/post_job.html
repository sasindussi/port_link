<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port Link - Post Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-navbar { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Port Link <span class="text-info">Client Dashboard</span></a>
            <div class="ms-auto">
                <a href="/profile" class="btn btn-outline-light btn-sm rounded-pill px-3 me-2">Profile</a>
                <a href="/logout" class="btn btn-danger btn-sm rounded-pill px-3">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4 rounded-4">
                    <h3 class="fw-bold text-primary mb-3"><i class="fa-solid fa-truck-fast me-2"></i> Post Container Transport Job</h3>
                    
                    <form action="/post-job" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Container Size</label>
                            <select class="form-select" name="container_size" required>
                                <option value="20ft Container">20ft Container</option>
                                <option value="40ft Container">40ft Container</option>
                                <option value="45ft High Cube">45ft High Cube</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">Pickup Location</label>
                            <input type="text" class="form-control" name="pickup_location" required placeholder="e.g., Colombo Port Gate 4">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">Dropoff Location</label>
                            <input type="text" class="form-control" name="dropoff_location" required placeholder="e.g., Kandy City Warehouse">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">Additional Details / Notes</label>
                            <textarea class="form-control" name="description" rows="3" placeholder="Any specific instructions..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm">Post Job Ad</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
