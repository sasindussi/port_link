<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Port Link - Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow-sm rounded-4" style="width: 400px;">
        <h3 class="fw-bold text-primary mb-3">Reset Password</h3>
        <p class="text-muted small mb-3">Enter your new password below.</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                    <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/reset-password/{{ email }}" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">New Password</label>
                <input type="password" class="form-control" name="password" required placeholder="Enter new password">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Confirm Password</label>
                <input type="password" class="form-control" name="confirm_password" required placeholder="Re-enter new password">
            </div>
            <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold">Update Password</button>
        </form>
    </div>
</body>
</html>
