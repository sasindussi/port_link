<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Port Link - Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow-sm rounded-4" style="width: 400px;">
        <h3 class="fw-bold text-primary mb-3">Verify OTP</h3>
        <p class="text-muted small mb-3">Enter the 6-digit OTP sent to <strong>{{ email }}</strong></p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                    <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/verify-otp?email={{ email }}" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">Enter 6-digit OTP</label>
                <input type="text" class="form-control text-center fs-4 tracking-widest" name="otp" required maxlength="6" placeholder="------">
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">Verify OTP</button>
        </form>
        <div class="text-center mt-3">
            <a href="/forgot-password" class="text-muted small text-decoration-none">Resend OTP</a>
        </div>
    </div>
</body>
</html>
