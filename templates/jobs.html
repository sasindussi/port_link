<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port Link - Available Jobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 3D Modern Navbar with Gradient */
        .custom-navbar {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 20%);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* 3D Glass Water Effect for Nav Links & Buttons */
        .navbar-nav .nav-link {
            color: #ffffff !important;
            font-weight: 500;
            padding: 8px 16px !important;
            margin: 0 4px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15), 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .navbar-nav .nav-link:hover, .navbar-nav .nav-link.active {
            background: rgba(2, 132, 199, 0.25);
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.3), 0 6px 15px rgba(2, 132, 199, 0.3);
            transform: translateY(-2px);
            color: #38bdf8 !important;
        }

        .navbar-nav .nav-link.btn-glass-signin {
            background: rgba(255, 255, 255, 0.08);
        }

        .navbar-nav .nav-link.btn-glass-register {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.4), rgba(14, 165, 233, 0.4));
            border: 1px solid rgba(56, 189, 248, 0.5);
            font-weight: 600;
        }

        /* Watermark Background for Content Section */
        .watermark-section {
            position: relative;
            background-color: #f8f9fa;
            min-height: 75vh;
            overflow: hidden;
        }

        .watermark-section::before {
            content: "";
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 750px;
            height: 750px;
            background-image: url('https://votwxipamylcvrthtdhg.supabase.co/storage/v1/object/sign/port_link/logo.webp?token=eyJraWQiOiIzNDYzNmYyZS01NDc1LTQ2MmItODUwZC02Y2Q3ZTIzNzY1MzkiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJwb3J0X2xpbmsvbG9nby53ZWJwIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc5MjY5NzUzOCwiZXhwIjo0OTQ2Mjk3NTM4fQ.3Aw-FVqzgyao_rmLK0n2h-3cPOKbiw_-csONm6taVFjRsNQuo2FcADDhWsmYyEGz9Sc7-QtAABpDj1sHu6o8xA');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.1;
            pointer-events: none;
            z-index: 0;
        }

        .watermark-section .container {
            position: relative;
            z-index: 1;
        }

        /* Glassmorphism Card Effect */
        .glass-card {
            background: rgba(24, 130, 237, 0.2) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-radius: 16px;
        }
        
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.12) !important;
        }
    </style>
</head>
<body class="bg-light">

    <!-- 3D Navigation Bar with Glass Links & Logo -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="/">
                <img src="https://votwxipamylcvrthtdhg.supabase.co/storage/v1/object/sign/port_link/logo.webp?token=eyJraWQiOiIzNDYzNmYyZS01NDc1LTQ2MmItODUwZC02Y2Q3ZTIzNzY1MzkiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJwb3J0X2xpbmsvbG9nby53ZWJwIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc5MjY5NzUzOCwiZXhwIjo0OTQ2Mjk3NTM4fQ.3Aw-FVqzgyao_rmLK0n2h-3cPOKbiw_-csONm6taVFjRsNQuo2FcADDhWsmYyEGz9Sc7-QtAABpDj1sHu6o8xA" 
                     alt="Port Link Logo" 
                     width="42" 
                     height="42" 
                     class="me-2 rounded-circle shadow-sm object-fit-cover border border-white">
                <span class="fs-4 tracking-wide">Port Link <span class="text-info"></span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/jobs">Available Jobs</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact">Contact Us</a></li>
                    <li class="nav-item"><a class="nav-link btn-glass-signin ms-2" href="/login">Log In</a></li>
                    <li class="nav-item"><a class="nav-link btn-glass-register ms-2" href="/register">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content Section with Logo Watermark & Glass Cards -->
    <div class="watermark-section py-5">
        <div class="container">
            <h2 class="mb-4 text-dark fw-bold">Available Container Transport Jobs</h2>
            <div class="row" id="jobListContainer">
                <!-- Job Card with Glassmorphism Effect -->
                <div class="col-md-4 mb-3">
                    <div class="card glass-card p-4">
                        <h5 class="fw-bold text-primary mb-3">Container: 40ft</h5>
                        <p class="text-muted mb-1"><i class="fa-solid fa-location-dot me-2 text-danger"></i>Pickup: Colombo Port</p>
                        <p class="text-muted mb-3"><i class="fa-solid fa-flag-checkered me-2 text-success"></i>Dropoff: Kandy City</p>
                        <div class="mb-3">
                            <span class="badge bg-warning text-dark px-3 py-2">Pending</span>
                        </div>
                        <a href="/register" class="btn btn-outline-primary w-100 rounded-pill fw-bold">See More Details (Register)</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    
</body>
</html>
