<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Port Link - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow-sm rounded-4" style="width: 400px;">
        <h3 class="fw-bold text-primary mb-3">Forgot Password</h3>
        <p class="text-muted small mb-3">Enter your registered email address to receive a secure password reset link.</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                    <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/forgot-password" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">Email Address</label>
                <input type="email" class="form-control" name="email" required placeholder="Enter your email">
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">Send Reset Link</button>
        </form>
        <div class="text-center mt-3">
            <a href="/login" class="text-muted small text-decoration-none">Back to Login</a>
        </div>
    </div>
</body>
</html>
